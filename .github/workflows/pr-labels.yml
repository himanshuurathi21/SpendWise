name: PR — Auto Label & Validate

on:
  pull_request:
    types: [opened, synchronize, labeled, unlabeled]

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  size-label:
    name: Label by Size
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/labeler@v6
        continue-on-error: true

  semantic-title:
    name: Validate PR Title
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            refactor
            perf
            test
            ci
            security
          requireScope: false
          subjectPattern: ^[A-Z].+
          subjectPatternError: |
            The subject must start with a capital letter.

  branch-name:
    name: Validate Branch Name
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check branch naming convention
        run: |
          BRANCH="${{ github.head_ref }}"
          if [[ ! "$BRANCH" =~ ^(feat|fix|chore|docs|refactor|perf|test|ci|security)/ ]]; then
            echo "::warning::Branch name '$BRANCH' should start with a category (e.g. feat/, fix/, chore/)"
          fi
